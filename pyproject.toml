[project]
name = "sensflow"
version = "0.1.0"
description = "Telegram-first automation platform for RBXCreate purchases"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiogram>=3.0,<4.0",
    "alembic>=1.0,<2.0",
    "asyncpg>=0.30,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.0,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.9,<1.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require external infrastructure",
    "unit: isolated tests without external infrastructure",
]
